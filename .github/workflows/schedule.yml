name: Load

on:
  schedule:
    # Dagster's daemon needs a process that runs continuously, which the free
    # tier does not offer, so the schedule lives here and calls the same assets.
    - cron: "20 11 * * *"
  workflow_dispatch:
    inputs:
      start:
        description: "First month to load, YYYY-MM. Defaults to the current one."
        required: false
      end:
        description: "Last month to load, YYYY-MM. Defaults to the current one."
        required: false

concurrency:
  # Two runs writing the same partitions would only repeat each other's work.
  group: load
  cancel-in-progress: false

jobs:
  load:
    runs-on: ubuntu-latest

    env:
      DBT_PROFILES_DIR: warehouse
      PYTHONPATH: .
      DAGSTER_HOME: ${{ github.workspace }}/deploy
      DAGSTER_PG_URL: ${{ secrets.DAGSTER_PG_URL }}
      WAREHOUSE_HOST: ${{ secrets.WAREHOUSE_HOST }}
      WAREHOUSE_USER: ${{ secrets.WAREHOUSE_USER }}
      WAREHOUSE_PASSWORD: ${{ secrets.WAREHOUSE_PASSWORD }}
      WAREHOUSE_DB: ${{ secrets.WAREHOUSE_DB }}
      WAREHOUSE_PORT: "5432"
      WAREHOUSE_SSLMODE: require

    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - run: pip install -r requirements-dev.txt

      - name: Parse the dbt project
        run: |
          dbt deps --project-dir warehouse
          dbt parse --project-dir warehouse

      # The month in progress is materialised every day, one partition per series.
      # Going through Dagster rather than calling the loader is what puts the run
      # in the history the deployed graph shows: a pipeline that bypassed its own
      # orchestrator would leave that page permanently empty.
      - name: Materialise the month in progress
        if: ${{ !inputs.start && !inputs.end }}
        run: |
          MONTH=$(date -u +%Y-%m-01)
          for KEY in $(python -c "from extract.config import SERIES; print(' '.join(s.key for s in SERIES))"); do
            echo "::group::$KEY"
            dagster asset materialize -m pipeline.definitions \
              --select "xm/xm_hourly" --partition "$MONTH|$KEY"
            echo "::endgroup::"
          done

      # A range asked for by hand is hundreds of partitions, and a Dagster process
      # per partition would spend longer starting than fetching. The loader does
      # the work and the events are reported afterwards, so the graph still knows.
      - name: Backfill a range
        if: ${{ inputs.start || inputs.end }}
        env:
          START: ${{ inputs.start }}
          END: ${{ inputs.end }}
        run: |
          MONTH=$(date -u +%Y-%m)
          python -m extract.backfill --start "${START:-$MONTH}" --end "${END:-$MONTH}"
          python -m pipeline.reconcile

      - name: Build the warehouse
        run: |
          dagster asset materialize -m pipeline.definitions \
            --select "staging/stg_xm_hourly+"
