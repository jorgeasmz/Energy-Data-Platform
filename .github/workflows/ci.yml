name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest

    services:
      warehouse:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: energy
          POSTGRES_PASSWORD: energy
          POSTGRES_DB: energy
        ports:
          - 5435:5432
        options: >-
          --health-cmd "pg_isready -U energy"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      WAREHOUSE_URL: postgresql://energy:energy@localhost:5435/energy
      DBT_PROFILES_DIR: warehouse
      PYTHONPATH: .

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - run: pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      # The asset graph reads the dbt manifest when it is imported, and the
      # manifest is a build artefact rather than a file in the repository. Parsing
      # needs the project and its packages, not a database.
      - name: Parse the dbt project
        run: |
          dbt deps --project-dir warehouse
          dbt parse --project-dir warehouse

      - name: Unit tests
        run: pytest

      - name: Database tests
        run: pytest -m postgres --no-cov

      # The models are the product, so CI runs them against a fixture rather than
      # only parsing them. Every dbt test is a check on the transformation itself.
      - name: Load the fixture
        run: |
          psql "$WAREHOUSE_URL" -f warehouse/sql/raw_schema.sql
          psql "$WAREHOUSE_URL" -f tests/fixtures/raw_sample.sql

      - name: Build the warehouse
        run: dbt build --project-dir warehouse
