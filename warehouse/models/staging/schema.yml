version: 2

models:
  - name: stg_xm_hourly
    description: One row per metric, entity, date and hour.
    columns:
      - name: metric_id
        data_tests: [not_null]
      - name: hour_of_day
        description: 1 to 24, where 1 is the hour beginning at midnight.
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 1
                max_value: 24
                inclusive: true
      - name: measured_at
        data_tests: [not_null]
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [metric_id, entity, resource_code, measured_at]
